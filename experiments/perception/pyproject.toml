[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replay-lab-perception-experiment"
version = "0.1.0"
requires-python = ">=3.11"
description = "Isolated detection, tracking and referee-observation diagnostics; not adjudication"

[tool.setuptools.packages.find]
where = ["src"]
include = ["replay_perception*"]
namespaces = true

[tool.setuptools.package-data]
replay_perception = ["model-manifest.json", "observer-models.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
