[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "replay-lab-video-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.8",
]

[project.scripts]
replay-video = "replay_video.cli:main"
replay-worker = "replay_video.runner:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["replay_video*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
